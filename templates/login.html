<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Sign in — PDFsmith</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         background: #f5f5f7; color: #1d1d1f; height: 100vh; margin: 0;
         display: flex; align-items: center; justify-content: center; }
  .card { background: white; padding: 36px 40px; border-radius: 12px;
          box-shadow: 0 1px 4px rgba(0,0,0,0.06); width: 100%; max-width: 380px; }
  h1 { font-size: 20px; margin-bottom: 6px; }
  p  { color: #86868b; font-size: 14px; margin-bottom: 22px; }
  label { font-size: 12px; color: #86868b; display: block; margin-bottom: 6px;
          text-transform: uppercase; letter-spacing: 0.4px; }
  input[type=password] {
    width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #d1d1d6;
    border-radius: 8px; background: white; font-family: inherit;
  }
  input[type=password]:focus { outline: none; border-color: #007aff; }
  button { margin-top: 16px; width: 100%; padding: 10px; background: #007aff;
           color: white; border: none; border-radius: 8px; font-size: 15px;
           font-weight: 500; cursor: pointer; }
  button:hover { background: #0066d6; }
  .alert.error { background: #ffebee; color: #c62828; padding: 8px 12px;
                 border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
</style></head>
<body>
  <form class="card" method="POST" action="{{ url_for('login_post') }}">
    <h1>PDFsmith</h1>
    <p>Edit PDFs in place. Enter the shared password to continue.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <label for="pw">Password</label>
    <input type="password" name="password" id="pw" autofocus autocomplete="current-password">
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</body></html>
